<!doctype html>
<html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>零件庫搜尋回饋原型</title>
<link rel="stylesheet" href="../../../src/styles/colors.css">
<link rel="stylesheet" href="../../../src/styles/m3.css">
<link rel="stylesheet" href="../../../src/styles/m3-components.css">
<style>
  /* 字型：與正式站相同的三支自架字型（正式站由 next/font 注入 --font-body /
     --font-display；原型在這裡自己宣告）。Taipei Sans 子集只涵蓋站上用過的字，
     原型文案裡沒被子集收錄的字會逐字退回系統字型。 */
  @font-face { font-family: "Taipei Sans TC"; src: url("../../../src/fonts/taipei-sans-tc-regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
  @font-face { font-family: "Taipei Sans TC"; src: url("../../../src/fonts/taipei-sans-tc-bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
  @font-face { font-family: "Combat"; src: url("../../../src/fonts/combat.woff2") format("woff2"); font-weight: 400 700; font-display: swap; }
  :root { --font-body: "Taipei Sans TC"; --font-display: "Combat"; color-scheme: light; }

  html { background: var(--md-sys-color-surface); }
  body {
    margin: 0;
    padding-block: 0 4rem;
    padding-inline: clamp(1rem, 4vw, 3rem);
    background: var(--md-sys-color-surface);
    color: var(--md-sys-color-on-surface);
    font-family: var(--md-sys-typescale-body-medium-font);
    font-size: var(--md-sys-typescale-body-medium-size);
    line-height: var(--md-sys-typescale-body-medium-line-height);
  }
  * { box-sizing: border-box; }
  .page { max-width: 68rem; margin-inline: auto; }

  /* 原型工作列：不是產品的一部分，用 surface-container-highest 與產品區隔 */
  .bench {
    display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem 1.25rem;
    margin: 1rem 0 2.5rem; padding: 0.75rem 1rem;
    border-radius: var(--md-sys-shape-corner-medium);
    background: var(--md-sys-color-surface-container-highest);
    color: var(--md-sys-color-on-surface-variant);
    font-size: var(--md-sys-typescale-label-medium-size);
    line-height: var(--md-sys-typescale-label-medium-line-height);
  }
  .bench strong { color: var(--md-sys-color-on-surface); font-family: var(--md-sys-typescale-label-large-font); font-size: var(--md-sys-typescale-label-large-size); }
  .bench .m3-chip-set { margin: 0; }
  .bench .m3-chip { cursor: pointer; }

  h1 {
    margin: 0 0 0.25rem;
    font-family: var(--md-sys-typescale-headline-large-font);
    font-size: var(--md-sys-typescale-headline-large-size);
    line-height: var(--md-sys-typescale-headline-large-line-height);
    font-weight: var(--md-sys-typescale-headline-large-weight);
  }
  .count { margin: 0 0 1.25rem; color: var(--md-sys-color-on-surface-variant); }
  .count output { font-family: var(--md-sys-typescale-numeral-font); font-variant-numeric: tabular-nums; color: var(--md-sys-color-on-surface); }

  /* 搜尋列：沿用正式站 /parts 的排版（欄位＋世代＋搜尋鈕） */
  form.search {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(12rem, 18rem) auto;
    gap: 0.75rem; align-items: start;
    padding: 0.75rem; border-radius: var(--md-sys-shape-corner-large);
    background: var(--md-sys-color-surface-container-lowest); /* strike 在 surface-50 上 5.59:1（ADR-0008），在 container-low 上只有 4.52 */
  }
  form.search .m3-button { min-height: 3.5rem; align-self: start; }
  form.search .m3-field { --m3-field-bg: var(--md-sys-color-surface-container-lowest); }
  /* 原生 search 的取消鈕是瀏覽器藍色，不在色階上；正式站也該關掉 */
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }

  /* 提案 H1：邊打邊回報「符合幾筆」，清單本身仍等送出 */
  .m3-field__support[data-tone="none"] { color: var(--md-sys-color-on-surface-variant); }
  .m3-field__support[data-tone="hit"] { color: var(--md-sys-color-on-surface); }
  .m3-field__support[data-tone="miss"] { color: var(--md-sys-color-error); }
  .m3-field__support .n { font-family: var(--md-sys-typescale-numeral-font); font-variant-numeric: tabular-nums; }

  .tabs { margin: 1.5rem 0 1rem; }

  /* 結果表：只放正式站已有的欄位 */
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 0.75rem 0.5rem; text-align: left; border-bottom: 1px solid var(--md-sys-color-outline-variant); vertical-align: top; }
  th { color: var(--md-sys-color-on-surface-variant); font-family: var(--md-sys-typescale-label-large-font); font-size: var(--md-sys-typescale-label-large-size); font-weight: var(--md-sys-typescale-label-large-weight); }
  th.num, td.num { text-align: right; }
  td.num { font-family: var(--md-sys-typescale-numeral-font); font-size: 1.125rem; font-variant-numeric: tabular-nums; }
  td .name { color: var(--md-sys-color-primary); font-weight: 700; }
  td .sub { display: block; color: var(--md-sys-color-on-surface-variant); font-size: var(--md-sys-typescale-body-small-size); }
  .gen { color: var(--md-sys-color-on-surface-variant); font-size: var(--md-sys-typescale-label-medium-size); }
  .table-wrap { overflow-x: auto; }

  /* 提案 H2：無結果不是一行字，是一個能回頭的地方 */
  .empty {
    max-width: 40rem; margin: 1.5rem 0; padding: 1.5rem;
    border-radius: var(--md-sys-shape-corner-large);
    background: var(--md-sys-color-surface-container);
  }
  .empty h2 { margin: 0 0 0.5rem; font-family: var(--md-sys-typescale-title-medium-font); font-size: 1.125rem; line-height: 1.4; }
  .empty h2 q { quotes: "「" "」"; }
  .empty p { margin: 0 0 1rem; color: var(--md-sys-color-on-surface-variant); }
  .empty .actions { display: flex; flex-wrap: wrap; gap: 0.5rem 0.75rem; }
  .empty .actions .n { font-family: var(--md-sys-typescale-numeral-font); font-variant-numeric: tabular-nums; margin-inline-start: 0.35em; }

  /* 現況：正式站今天的樣子，留著讓受測者能對照 */
  .empty--current { background: transparent; padding: 0.5rem 0; }
  .empty--current p { color: var(--md-sys-color-on-surface); }

  .m3-visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  .colophon { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--md-sys-color-outline-variant); color: var(--md-sys-color-on-surface-variant); font-size: var(--md-sys-typescale-body-small-size); line-height: 1.6; }
  .colophon p { margin: 0 0 0.5rem; }

  @media (max-width: 720px) {
    form.search { grid-template-columns: 1fr; }
    form.search .m3-button { width: 100%; }
    th.hide-m, td.hide-m { display: none; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="bench" role="group" aria-label="原型設定">
    <strong>原型</strong>
    <span>切換兩種版本給同一位受測者看。資料是正式站 2026-09-07 的目錄快照。</span>
    <div class="m3-chip-set" id="variant">
      <button type="button" class="m3-chip m3-chip--selected m3-state" data-variant="proposal" aria-pressed="true">提案</button>
      <button type="button" class="m3-chip m3-state" data-variant="current" aria-pressed="false">現況</button>
    </div>
  </div>

  <h1>零件庫</h1>
  <p class="count">零件 · <output id="count" for="q">0</output> 筆</p>

  <form class="search" id="search" role="search">
    <label class="m3-field">
      <input class="m3-field__input" id="q" name="q" type="search" placeholder="輸入英文、日文、中文或玩家俗稱" autocomplete="off">
      <span class="m3-field__label">搜尋零件庫</span>
      <span class="m3-field__support" id="support" data-tone="none" aria-live="polite"></span>
    </label>
    <label class="m3-field m3-field--select">
      <select class="m3-field__input" id="gen" name="gen">
        <option value="x">BEYBLADE X</option>
        <option value="burst">Beyblade Burst</option>
        <option value="metal_fight">Metal Fight Beyblade</option>
        <option value="bakuten_shoot">Original Generation</option>
        <option value="all">全部世代</option>
      </select>
      <span class="m3-field__label">世代</span>
    </label>
    <button type="submit" class="m3-button m3-button--filled m3-state">搜尋</button>
  </form>

  <nav class="m3-tabs tabs" id="tabs" aria-label="種類"></nav>

  <div id="results" aria-live="polite"></div>

  <div class="colophon">
    <p>這是可用性測試用的原型，不是正式頁面。零件名稱與數值取自 <code>data/parts.json</code> 與 <code>data/generation-catalog.json</code>；非 X 世代的零件目錄裡沒有 Stat，所以這裡也不顯示。</p>
    <p>兩個假設：H1 邊打字邊顯示「符合幾筆」但清單仍等送出；H2 無結果時給出「清除」與「改搜全部世代」兩條回頭的路，且種類分頁不消失。測試計畫在 <code>.scratch/ui-feedback-and-error-states/spec.md</code>。</p>
  </div>
</div>

  const q = $("q"), gen = $("gen"), support = $("support"), results = $("results"), tabs = $("tabs"), count = $("count");
  let variant = "proposal";
  let submitted = { q: "", gen: "x", type: "all" };

  // ── H1：打字時的即時計數（提案限定），清單不動 ─────────────────────────
  function liveHint() {
    if (variant !== "proposal") { support.textContent = ""; support.dataset.tone = "none"; return; }
    const value = q.value.trim();
    if (!value) { support.textContent = ""; support.dataset.tone = "none"; return; }
    const here = search(value, gen.value).length;
    if (here > 0) {
      support.dataset.tone = "hit";
      support.innerHTML = `符合 <span class="n">${here}</span> 筆，按 Enter 或「搜尋」查看`;
      return;
    }
    const everywhere = gen.value === "all" ? 0 : search(value, "all").length;
    support.dataset.tone = "miss";
    support.innerHTML = everywhere > 0
      ? `${GEN[gen.value]} 沒有符合的零件，其他世代有 <span class="n">${everywhere}</span> 筆`
      : `找不到符合的零件`;
  }

  // ── 種類分頁：提案版在 0 筆時也留著，計數歸零而不是整列消失 ───────────
  function renderTabs(list) {
    const byType = { all: list.length };
    for (const r of list) byType[r.type] = (byType[r.type] || 0) + 1;
    const order = ["all", "blade", "ratchet", "bit", ...Object.keys(byType).filter((t) => !["all", "blade", "ratchet", "bit"].includes(t))];
    if (variant === "current" && list.length === 0) { tabs.innerHTML = ""; tabs.hidden = true; return; }
    tabs.hidden = false;
    tabs.innerHTML = order.filter((t) => t === "all" || byType[t] !== undefined || ["blade", "ratchet", "bit"].includes(t)).map((t) => {
      const label = t === "all" ? "全部" : (TYPE[t] || t.replace(/_/g, " "));
      const n = byType[t] || 0;
      const current = submitted.type === t ? ' aria-current="page"' : "";
      return `<button type="button" class="m3-tab m3-state" data-type="${t}"${current}>${label}<span class="m3-tab__count">${n}</span></button>`;
    }).join("");
  }

  function renderEmpty() {
    const { q: value, gen: g } = submitted;
    if (variant === "current") {
      return `<div class="empty empty--current"><p>找不到符合條件的零件</p></div>`;
    }
    const everywhere = g === "all" ? 0 : search(value, "all").length;
    const where = g === "all" ? "所有世代" : GEN[g];
    const actions = [
      `<button type="button" class="m3-button m3-button--text m3-state" data-action="clear">清除搜尋</button>`,
      everywhere > 0 ? `<button type="button" class="m3-button m3-button--tonal m3-state" data-action="all">改搜全部世代<span class="n">${everywhere}</span></button>` : "",
    ].join("");
    const scope = value ? `在 ${where} 找不到<q>${escapeHtml(value)}</q>` : `${where}目前沒有符合這個種類的零件`;
    return `<section class="empty" aria-labelledby="empty-h">
      <h2 id="empty-h">${scope}</h2>
      <p>已比對英文、日文、中文與玩家俗稱。${g !== "all" && everywhere === 0 ? "其他世代也沒有。" : ""}輸入的若是俗稱或簡寫，可能還沒被收進 Alias，歡迎在該零件頁的討論裡留下。</p>
      <div class="actions">${actions}</div>
    </section>`;
  }

  function renderTable(list) {
    const hasStats = list.some((r) => r.stats);
    const head = `<tr><th>種類</th><th>名稱</th>${hasStats ? `<th class="num">Attack</th><th class="num">Defense</th><th class="num">Stamina</th>` : `<th class="hide-m">世代</th>`}</tr>`;
    const body = list.map((r) => {
      const type = TYPE[r.type] || r.type.replace(/_/g, " ").replace(/^\w/, (c) => c.toUpperCase());
      const name = r.zh ? `<span class="name">${escapeHtml(r.zh)}</span><span class="sub">${escapeHtml(r.en)}${r.ja ? " · " + escapeHtml(r.ja) : ""}</span>` : `<span class="name">${escapeHtml(r.en)}</span>`;
      const cells = hasStats
        ? (r.stats ? `<td class="num">${r.stats.attack}</td><td class="num">${r.stats.defense}</td><td class="num">${r.stats.stamina}</td>` : `<td class="num">—</td><td class="num">—</td><td class="num">—</td>`)
        : `<td class="hide-m gen">${GEN[r.gen]}</td>`;
      return `<tr><td>${type}</td><td>${name}</td>${cells}</tr>`;
    }).join("");
    return `<div class="table-wrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div>`;
  }

  function render() {
    const pool = search(submitted.q, submitted.gen);
    renderTabs(pool);
    const list = submitted.type === "all" ? pool : pool.filter((r) => r.type === submitted.type);
    count.value = String(list.length);
    results.innerHTML = list.length ? renderTable(list) : renderEmpty();
  }

  function escapeHtml(s) { return s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  $("search").addEventListener("submit", (e) => {
    e.preventDefault();
    submitted = { q: q.value.trim(), gen: gen.value, type: "all" };
    render();
  });
  q.addEventListener("input", liveHint);
  gen.addEventListener("change", liveHint);
  tabs.addEventListener("click", (e) => {
    const t = e.target.closest("[data-type]"); if (!t) return;
    submitted.type = t.dataset.type; render();
  });
  results.addEventListener("click", (e) => {
    const b = e.target.closest("[data-action]"); if (!b) return;
    if (b.dataset.action === "clear") { q.value = ""; submitted = { q: "", gen: submitted.gen, type: "all" }; liveHint(); render(); q.focus(); }
    if (b.dataset.action === "all") { gen.value = "all"; submitted = { q: submitted.q, gen: "all", type: "all" }; liveHint(); render(); }
  });
  $("variant").addEventListener("click", (e) => {
    const b = e.target.closest("[data-variant]"); if (!b) return;
    variant = b.dataset.variant;
    for (const c of $("variant").querySelectorAll("[data-variant]")) {
      const on = c === b; c.classList.toggle("m3-chip--selected", on); c.setAttribute("aria-pressed", String(on));
    }
    liveHint(); render();
  });

  render();
})();
</script>

</body>
</html>
