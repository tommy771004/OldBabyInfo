name: Product scrape

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRODUCT_EXPECTED_COUNT: ${{ vars.PRODUCT_EXPECTED_COUNT }}
      PRODUCT_SCRAPE_INTERVAL_MS: "10000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape and persist Stock Listings
        id: scrape
        continue-on-error: true
        run: npm run scrape:products

      - name: Record failure and fail the job
        if: steps.scrape.outcome == 'failure'
        run: |
          {
            echo "## Product scrape failed"
            echo
            echo "The runner exited non-zero. Check the step log for the target-level error without exposing repository secrets."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
