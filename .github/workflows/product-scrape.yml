name: Product scrape

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: product-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRODUCT_EXPECTED_COUNT: ${{ vars.PRODUCT_EXPECTED_COUNT }}
      PRODUCT_SCRAPE_INTERVAL_MS: "10000"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check reviewed product targets
        id: targets
        run: |
          node -e 'const fs=require("node:fs"); const targets=JSON.parse(fs.readFileSync("data/product-targets.json", "utf8")); const sources=JSON.parse(fs.readFileSync("data/funbox-category-sources.json", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_targets=${targets.length > 0 ? "true" : "false"}\nhas_work=${targets.length > 0 || sources.length > 0 ? "true" : "false"}\n`);'

      - name: Install Chromium
        if: steps.targets.outputs.has_targets == 'true'
        run: npx playwright install --with-deps chromium

      - name: Scrape and persist Stock Listings
        id: scrape
        if: steps.targets.outputs.has_work == 'true'
        continue-on-error: true
        run: npm run scrape:products

      - name: Record safe no-op
        if: steps.targets.outputs.has_work != 'true'
        run: echo "No reviewed product targets or category sources; scrape skipped."

      - name: Record failure and fail the job
        if: steps.scrape.outcome == 'failure'
        run: |
          {
            echo "## Product scrape failed"
            echo
            echo "The runner exited non-zero. Check the step log for the target-level error without exposing repository secrets."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
