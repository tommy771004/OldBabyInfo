name: Official Part refresh

on:
  schedule:
    - cron: "17 18 * * 0" # 02:17 Monday Asia/Taipei
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: official-parts-refresh
  cancel-in-progress: false

jobs:
  part-refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The generator fails before fetching when published Parts carry phstudy
      # authority. Do not bypass that guard with an automated phstudy scrape:
      # its acquisition policy is separate and staged files are git-ignored.
      - name: Refresh structured official Part facts
        id: parts
        run: npm run refresh:parts

      - name: Explain a blocked or failed Part refresh
        if: failure() && steps.parts.outcome == 'failure'
        run: |
          {
            echo "## Part refresh did not complete; no review PR was attempted"
            echo
            echo "Check the Part refresh log for the exact error."
            echo "A BeyBrew-only replacement is blocked when published Parts carry phstudy field authority (ADR-0013)."
            echo "Do not enable phstudy acquisition or remove provenance to bypass this guard."
            echo "Recovery procedure: docs/agents/data-refresh-recovery.md"
          } >> "$GITHUB_STEP_SUMMARY"

  # Independent job: Part authority review must not stall the separate Catalog.
  # No `needs: part-refresh`; this checkout never runs the Part generator.
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refresh generation catalog
        run: npm run refresh:generation-catalog

      - name: Check for deterministic data changes
        id: diff
        run: |
          if git diff --quiet -- data/generation-catalog.json data/generation-catalog-needs-review.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update review PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "資料更新：Generation Catalog"
          title: "Generation Catalog 更新"
          body: |
            `npm run refresh:generation-catalog` 產生的 deterministic diff。

            本 PR 只更新 Catalog 的結構化名稱、關係與 Needs Review；不重建 `data/parts.json`，不取得 phstudy 快照，不複製程式碼、全文或圖片。
            Part 自動刷新由獨立 job 報告 Field Authority 阻擋；本 PR 不代表 Part 更新已恢復。
            請人工審查 Catalog 與 Needs Review diff 後再合併。
          add-paths: |
            data/generation-catalog.json
            data/generation-catalog-needs-review.json
          branch: auto/generation-catalog-refresh
          labels: automated-data-ingest

      # 2026-08-02 的執行就是卡在這裡：分支推上去了，PR 因為 repo 設定不允許
      # Actions 建立 PR 而失敗，且失敗原因只留在 log 裡沒有人看到。
      - name: Explain a failed PR step
        if: failure() && steps.pr.outcome == 'failure'
        run: |
          {
            echo "## Generation Catalog 的 PR 沒有開成"
            echo
            echo "建立或更新 PR 的步驟失敗；不能由此判定分支已推送成功。請先查看該步驟 log。"
            echo "若錯誤是 Actions 不允許建立 PR，請檢查 repo 設定："
            echo "Settings → Actions → General → Workflow permissions →"
            echo "**Allow GitHub Actions to create and approve pull requests** 沒有勾選。"
            echo
            echo "排除 log 中的錯誤後再重跑。若確認分支存在且資料完整，可人工比對："
            echo "${{ github.server_url }}/${{ github.repository }}/compare/auto/generation-catalog-refresh?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
