name: Community source policy gate

on:
  schedule:
    - cron: "0 18 * * 0" # Monday 02:00 Asia/Taipei (Sunday 18:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: community-source-policy
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Evaluate source acquisition policy
        id: policy
        run: npm run check:community-sources

      - name: Explain disabled acquisition
        if: steps.policy.outputs.phstudy_automation_eligible != 'true'
        run: echo "phstudy refresh remains disabled; no phstudy fetch or dataset write will run."

      # This remains skipped while phstudy is rights: unknown / enabled: false.
      # If an explicit publication-rights decision later makes it eligible, the
      # same operator command must scrape first and pass complete Bit parity;
      # any audit drift stops the job before a merge or publication step exists.
      - name: Refresh and audit phstudy Bit snapshot
        if: steps.policy.outputs.phstudy_automation_eligible == 'true'
        run: npm run refresh:phstudy-bit
