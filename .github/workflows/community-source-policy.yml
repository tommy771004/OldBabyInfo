name: Community source policy gate

on:
  schedule:
    - cron: "0 18 * * 0" # Monday 02:00 Asia/Taipei (Sunday 18:00 UTC)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: community-source-policy
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Evaluate source acquisition policy
        id: policy
        run: npm run check:community-sources

      - name: Explain disabled acquisition
        if: steps.policy.outputs.eligible != 'true'
        run: echo "No rights-compliant community source is enabled; no fetch or dataset write will run."

      # This gate intentionally has no fetch step. A source must first be
      # reviewed in data/community-source-policy.json, with compatible rights,
      # before a future acquisition command can be enabled here.
