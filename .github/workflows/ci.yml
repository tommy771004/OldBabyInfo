name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Next generates .next/types as part of the build. Generate those
      # declarations before the standalone typecheck so a clean runner does
      # not fail merely because the directory does not exist yet.
      - run: npm run build

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
