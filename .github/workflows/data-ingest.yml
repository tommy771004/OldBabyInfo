name: Data ingest

# Ticket 25 — the PR gate ADR-0004 requires: a scheduled script does the
# fetching, a human still approves before anything real merges. Scoped to
# scripts/ingest-events.ts (ticket 32) for now — the one ingest pipeline
# that's schedulable with no arguments and needs no model-call secret
# (it's the deterministic CSV path; see ticket 32's own Comments for why).
# scripts/extract-mold-batches.ts (ticket 35) needs a specific article URL
# per run, not something a blind schedule can drive — wiring it in is a
# separate step once there's a real list of articles to check.

on:
  schedule:
    - cron: "0 18 * * *" # 18:00 UTC = 02:00 Asia/Taipei
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-ingest
  cancel-in-progress: false

jobs:
  ingest-events:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The full per-row diff goes to the job log and stays there. Only the
      # capped summary reaches an output: this body used to carry all ~700
      # changed rows, and create-pull-request passes its body through the
      # environment, so every scheduled run died with "Argument list too
      # long" after a perfectly successful fetch.
      - name: Run event ingest
        id: ingest
        env:
          INGEST_SUMMARY_PATH: ${{ runner.temp }}/ingest-summary.md
        run: |
          node scripts/ingest-events.ts
          {
            echo "summary<<INGEST_SUMMARY_EOF"
            head -c 8000 "$INGEST_SUMMARY_PATH" 2>/dev/null || echo "No summary was produced by this run."
            echo
            echo "INGEST_SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Check for real changes
        id: diff
        run: |
          if git diff --quiet -- data/events.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect Needs Review items
        id: review
        run: |
          if [ -f data/mold-batch-needs-review.json ]; then
            {
              echo "summary<<NEEDS_REVIEW_EOF"
              # Capped for the same reason the ingest summary is.
              head -c 8000 data/mold-batch-needs-review.json
              echo
              echo "NEEDS_REVIEW_EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "summary=No Needs Review file was produced by this run." >> "$GITHUB_OUTPUT"
          fi

      # peter-evans/create-pull-request pushes to a fixed branch name and
      # itself detects/updates an already-open PR from that branch rather
      # than opening a duplicate — satisfies "既有 PR 尚未合併時更新該
      # PR" without hand-rolled PR-lookup logic. It also only actually
      # creates a PR when there's something to commit, so "無變動時不
      # 建立 PR" is the action's own default behavior, not something this
      # workflow has to implement — the explicit changed-check above is
      # kept anyway so a no-op run is visibly a no-op in the job log.
      - name: Open or update PR
        id: pr
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "資料更新：賽事行事曆自動匯入"
          title: "賽事行事曆自動匯入"
          body: |
            自動排程執行 `scripts/ingest-events.ts` 產生的真實變動，來源是 Funbox／B4 門市時間表的公開 Google Sheets。

            ${{ steps.ingest.outputs.summary }}

            完整逐筆 diff 見 [job log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})。

            ## Needs Review

            The following items require human judgment because the extraction models disagreed. Do not merge them without checking both candidate results:

            ```
            ${{ steps.review.outputs.summary }}
            ```

            合併前請確認：新增／變更的場次資訊（日期、地點、報名方式、人數上限）看起來合理。合併後 Vercel 會依既有的 GitHub 整合自動部署，這個 workflow 不需要另外觸發部署。
          branch: auto/event-ingest
          labels: automated-data-ingest

      # `create-pull-request` pushes the branch before it tries to open the
      # PR, so a denied PR creation still leaves the data on auto/event-ingest
      # — recoverable by hand, but only if the reason is visible. This ran red
      # for two weeks without anyone learning why.
      - name: Explain a failed PR step
        if: failure() && steps.pr.outcome == 'failure'
        run: |
          {
            echo "## 賽事匯入的 PR 沒有開成"
            echo
            echo "建立或更新 PR 的步驟失敗；不能由此判定分支已推送成功。請先查看該步驟 log。"
            echo "若錯誤是 Actions 不允許建立 PR，請檢查 repo 設定："
            echo "Settings → Actions → General → Workflow permissions →"
            echo "**Allow GitHub Actions to create and approve pull requests** 沒有勾選。"
            echo
            echo "排除 log 中的錯誤後再重跑。若確認分支存在且資料完整，可人工比對："
            echo "${{ github.server_url }}/${{ github.repository }}/compare/auto/event-ingest?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
